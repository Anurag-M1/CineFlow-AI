<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" fill="none">
  <defs>
    <linearGradient id="cf-logo-gradient" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="cf-logo-accent" x1="18" y1="18" x2="46" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>
    <filter id="cf-logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2563EB" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Icon Base -->
  <g transform="translate(6, 6)">
    <rect width="52" height="52" rx="12" fill="#0B0F19" />
    <rect x="0.75" y="0.75" width="50.5" height="50.5" rx="11.25" stroke="#1E293B" stroke-width="1.5" />
    <circle cx="26" cy="26" r="14" fill="#3B82F6" opacity="0.12" />

    <!-- Outer Film Reel Rim -->
    <path
      d="M26 8C16.06 8 8 16.06 8 26C8 35.94 16.06 44 26 44C33.02 44 39.1 39.99 42.04 34.12"
      stroke="url(#cf-logo-gradient)"
      stroke-width="2.5"
      stroke-linecap="round"
      filter="url(#cf-logo-glow)"
    />

    <!-- Sprockets -->
    <rect x="11.5" y="18" width="2" height="3" rx="0.75" fill="#38BDF8" opacity="0.8" />
    <rect x="11.5" y="31" width="2" height="3" rx="0.75" fill="#38BDF8" opacity="0.8" />
    <rect x="18" y="11" width="3" height="2" rx="0.75" fill="#38BDF8" opacity="0.8" />
    <rect x="31" y="11" width="3" height="2" rx="0.75" fill="#38BDF8" opacity="0.8" />
    <rect x="18" y="39" width="3" height="2" rx="0.75" fill="#818CF8" opacity="0.8" />
    <rect x="31" y="39" width="3" height="2" rx="0.75" fill="#818CF8" opacity="0.8" />

    <!-- Central Agent Wedge -->
    <path
      d="M19 18.5L36.5 26L19 33.5V18.5Z"
      fill="url(#cf-logo-gradient)"
      stroke="url(#cf-logo-accent)"
      stroke-width="1.2"
      stroke-linejoin="round"
    />
    <circle cx="36.5" cy="26" r="2.8" fill="#38BDF8" />
  </g>

  <!-- Typography -->
  <text x="70" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="20" font-weight="700" letter-spacing="-0.5" fill="#0F172A">
    CineFlow <tspan fill="url(#cf-logo-gradient)">AI</tspan>
  </text>
  <text x="70" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="10.5" font-weight="500" letter-spacing="0.3" fill="#64748B">
    PRODUCTION OPERATIONS
  </text>
</svg>
